<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white transition-colors duration-300">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden group/design-root">
        <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
            <div class="particle-bg" style="left: 10%; animation-delay: 0s;"></div>
            <div class="particle-bg" style="left: 30%; animation-delay: 2s;"></div>
            <div class="particle-bg" style="left: 50%; animation-delay: 4s;"></div>
            <div class="particle-bg" style="left: 70%; animation-delay: 6s;"></div>
            <div class="particle-bg" style="left: 90%; animation-delay: 8s;"></div>

            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/20 rounded-full blur-[150px] mix-blend-screen floating"
                style="animation-delay: 1.5s;">
            </div>
            <div class="absolute top-[50%] left-[60%] w-[30%] h-[30%] bg-primary/10 rounded-full blur-[100px] mix-blend-screen floating"
                style="animation-delay: 3s;">
            </div>
        </div>

        <tiidi-header root="./" active-page="contacto"></tiidi-header>

        <main class="flex-1 flex flex-col items-center pt-24 px-4 sm:px-6 lg:px-20 w-full pb-20">
            <div class="max-w-[1400px] w-full flex flex-col gap-10 mt-6 lg:mt-12">
                <div class="flex flex-col items-center text-center gap-4 mb-4">
                    <div
                        class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                        <span class="w-2 h-2 rounded-full bg-secondary animate-pulse shadow-[0_0_8px_#7a2df6]"></span>
                        <span class="text-xs font-medium text-secondary tracking-wide uppercase">Nuevo Proyecto</span>
                    </div>
                    <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight leading-tight">
                        Empecemos a Construir algo <br />
                        <span
                            class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary drop-shadow-[0_0_15px_rgba(13,166,242,0.5)]">Extraordinario</span>
                    </h1>
                    <p class="text-gray-400 text-xl max-w-4xl">
                        Completa este formulario y nos pondremos en contacto contigo en menos de 24 horas para agendar
                        una primera reunión estratégica.
                    </p>
                </div>

                <div class="max-w-4xl mx-auto w-full">
                    <div
                        class="glass-panel bg-surface-dark border border-white/10 rounded-[2rem] p-8 md:p-12 shadow-2xl relative">
                        <div
                            class="absolute inset-0 bg-gradient-to-br from-primary/5 to-secondary/5 rounded-[2rem] pointer-events-none">
                        </div>
                        <form action="https://usebasin.com/f/464b7bb38efe" method="POST"
                            class="relative z-10 flex flex-col gap-8">
                            <input type="hidden" name="_gotcha" /> <!-- Spam protection -->
                            <!-- Sección: Datos Personales -->
                            <div class="flex flex-col gap-6">
                                <h3 class="text-white text-xl font-bold border-b border-white/5 pb-2">1. Información de
                                    Contacto</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="flex flex-col gap-2">
                                        <label class="text-sm font-semibold text-gray-300 ml-1"
                                            for="name">Nombre</label>
                                        <input
                                            class="w-full bg-background-dark/50 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-primary focus:shadow-[0_0_15px_rgba(13,166,242,0.2)] transition-all"
                                            id="name" name="name" placeholder="Tu nombre completo" type="text"
                                            required />
                                    </div>
                                    <div class="flex flex-col gap-2">
                                        <label class="text-sm font-semibold text-gray-300 ml-1" for="email">Email
                                            Corporativo</label>
                                        <input
                                            class="w-full bg-background-dark/50 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-primary focus:shadow-[0_0_15px_rgba(13,166,242,0.2)] transition-all"
                                            id="email" name="email" placeholder="nombre@empresa.com" type="email"
                                            required />
                                    </div>
                                </div>
                            </div>

                            <!-- Sección: Detalles del Proyecto -->
                            <div class="flex flex-col gap-6">
                                <h3 class="text-white text-xl font-bold border-b border-white/5 pb-2">2. Detalles del
                                    Proyecto</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="flex flex-col gap-2">
                                        <label class="text-sm font-semibold text-gray-300 ml-1" for="type">Tipo de
                                            Software</label>
                                        <select
                                            class="w-full bg-background-dark/50 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-all appearance-none cursor-pointer"
                                            id="type" name="project_type">
                                            <option>E-commerce / Tienda Online</option>
                                            <option>SaaS / Plataforma Web</option>
                                            <option>App Móvil (iOS/Android)</option>
                                            <option>Software a Medida (ERP/CRM)</option>
                                            <option>Automatización e IA</option>
                                        </select>
                                    </div>
                                    <div class="flex flex-col gap-2">
                                        <label class="text-sm font-semibold text-gray-300 ml-1" for="budget">Presupuesto
                                            Estimado</label>
                                        <select
                                            class="w-full bg-background-dark/50 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-all appearance-none cursor-pointer"
                                            id="budget" name="budget">
                                            <option>Menos de $5,000 USD</option>
                                            <option>$5,000 - $15,000 USD</option>
                                            <option>$15,000 - $30,000 USD</option>
                                            <option>Más de $30,000 USD</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-semibold text-gray-300 ml-1" for="details">¿Qué quieres
                                        construir?</label>
                                    <textarea
                                        class="w-full bg-background-dark/50 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-all resize-none"
                                        id="details" name="details"
                                        placeholder="Háblanos sobre tus objetivos, funcionalidades clave..." rows="5"
                                        required></textarea>
                                </div>
                            </div>

                            <button
                                class="group w-full flex items-center justify-center gap-2 bg-primary hover:bg-white text-white hover:text-primary font-bold text-xl rounded-xl py-5 shadow-neon hover:shadow-neon-hover transition-all duration-300"
                                type="submit">
                                Solicitar Propuesta
                                <span
                                    class="material-symbols-outlined text-2xl group-hover:translate-x-1 transition-transform">rocket_launch</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <tiidi-footer root="./"></tiidi-footer>
    </div>
</body>

</html>
